name = "oto-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

# Create with:  npx wrangler kv namespace create OTO
# then paste the printed id below.
kv_namespaces = [
  { binding = "OTO", id = "46dff4ae95ef4fbb9ad5bb7fab716f27" }
]

# TinyBase CRDT synchronizer (cell-level merge sync between live devices).
[[durable_objects.bindings]]
name = "OTO_DO"
class_name = "OtoSyncDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OtoSyncDO"]

# The calendar-reminder sweep is the only schedule (see sendEventReminders in
# worker.js). The old daily briefing/check-in crons were removed on 2026-08-17:
# Oto wants notifications ONLY for an event starting within his lead window.
[triggers]
crons = ["*/5 * * * *"]

[vars]
VAPID_SUBJECT = "mailto:ozolins.oto@gmail.com"
ALLOWED_ORIGIN = "https://akamaro777.github.io"
# Fallback only — the app syncs profile.timezone from the phone on each boot.
DEFAULT_TZ = "Europe/Riga"

# Secrets (set via CLI, never commit values):
#   npx wrangler secret put SYNC_SECRET
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_JWK
